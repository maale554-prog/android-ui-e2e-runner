name: Kids Police E2E Full UI & Video Suite

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release que contiene kidspolice-test.apk'
        default: 'e2e-v1'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar Pillow para auditoría de movimiento de video
        run: python3 -m pip install --quiet Pillow

      - name: Descargar kidspolice-test.apk (con Google TestIds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download "${{ inputs.release_tag }}" -p "kidspolice-test.apk" -D apk --repo "${{ github.repository }}"
          ls -lh apk/kidspolice-test.apk

      - name: Ejecutar suite E2E completa en Emulador Android Pixel 6 (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          script: bash ci/kidspolice_e2e.sh apk/kidspolice-test.apk

      - name: Publicar resumen en GitHub Actions
        if: always()
        run: |
          if [ -f "results/com.superappsmx.kidspolice/audit_report.md" ]; then
            cat "results/com.superappsmx.kidspolice/audit_report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "results/com.superappsmx.kidspolice/result.env" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Resultados Funcionales E2E" >> "$GITHUB_STEP_SUMMARY"
            echo '```ini' >> "$GITHUB_STEP_SUMMARY"
            cat "results/com.superappsmx.kidspolice/result.env" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir capturas PNG, volcados XML y logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidspolice-e2e-results
          path: results/
          retention-days: 7
          if-no-files-found: warn
